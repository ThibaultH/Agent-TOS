<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agent TOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-container">
        <div id="messages-display">
            <div class="message bot">Bonjour ! Je suis votre agent de simulation. Décrivez-moi votre situation pour commencer la prospection.</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Écrivez votre message...">
            <button id="send-button">Envoyer</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
